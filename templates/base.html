<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Customer Purchase AI{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script defer src="{{ url_for('static', filename='js/script.js') }}"></script>
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="{{ url_for('home') }}">✦ CustomerAI</a>
        <div class="nav-links">
            <a href="{{ url_for('home') }}">Predict</a>
            <a href="{{ url_for('prediction.history') }}">History</a>
        </div>
    </nav>
    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
    <footer>Built with Python · Flask · Scikit-learn · SQLite</footer>
</body>
</html>
